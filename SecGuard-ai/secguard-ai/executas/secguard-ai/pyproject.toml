[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-secguard-ai"
version = "0.1.0"
description = "Executa for the secguard-ai Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-secguard-ai" = "secguard_ai_plugin:main"

[tool.setuptools]
py-modules = ["secguard_ai_plugin"]
